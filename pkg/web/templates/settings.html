<!DOCTYPE html>
<html lang="tr">
<head>
    {{template "head" .}}
    <title>KeywordHunter - Ayarlar</title>
    <style>
        .strength { height: 4px; border-radius: 4px; background: rgba(255,255,255,.06); overflow: hidden; margin-top: 6px; }
        .strength > div { height: 100%; width: 0; transition: width .2s, background .2s; }
        .sec-title { font-size: .72rem; text-transform: uppercase; letter-spacing: .12em; color: var(--text-muted); font-weight: 800; margin: 6px 0 10px; }
    </style>
</head>
<body>
    {{template "navbar" .}}
    <main class="kh-page" style="max-width:1000px">
        <div class="kh-header"><div><h1 class="kh-title">Ayarlar</h1><p class="kh-subtitle">Çalışma zamanı yapılandırması · <span class="kh-mono" id="env-path"></span></p></div><div class="kh-actions"><span class="kh-badge neutral" id="ver"></span><span class="kh-badge" id="pw-storage"></span></div></div>
        <div id="settings-alert" style="display:none;margin-bottom:14px"></div>
        <form id="settings-form" style="display:grid;gap:18px">
            <section class="kh-card accent">
                <div class="sec-title">Kimlik</div>
                <div class="kh-grid cols-2">
                    <div class="kh-field"><label class="kh-label">Kullanıcı adı</label><input id="admin-user" class="kh-input" required maxlength="64" autocomplete="username"></div>
                    <div class="kh-field"><label class="kh-label">Yeni parola <span class="kh-hint">(değiştirmek için doldur)</span></label><input id="admin-pass" class="kh-input" type="password" minlength="8" autocomplete="new-password" placeholder="en az 8 karakter"><div class="strength"><div id="pw-bar"></div></div><span class="kh-hint" id="pw-hint">Parola bcrypt ile hash'lenir; düz metin dosyada tutulmaz. Değişince diğer oturumlar kapanır.</span></div>
                </div>
            </section>
            <section class="kh-card">
                <div class="sec-title">Web &amp; Oturum <span style="color:var(--accent-success)">· anında uygulanır</span></div>
                <div class="kh-grid cols-3">
                    <div class="kh-field"><label class="kh-label">Oturum süresi (saat)</label><input id="session-ttl" class="kh-input" type="number" min="1" max="720" required></div>
                    <div class="kh-field"><label class="kh-label">Hız limiti (istek/sn)</label><input id="rate-rps" class="kh-input" type="number" min="1" max="200" step="0.5" required></div>
                    <div class="kh-field"><label class="kh-label">Ani yük toleransı (burst)</label><input id="rate-burst" class="kh-input" type="number" min="1" max="500" required></div>
                </div>
                <label class="kh-inline" style="margin-top:12px;cursor:pointer"><input id="secure-cookies" type="checkbox"><span style="font-size:.86rem">Secure cookie (yalnızca HTTPS ters vekil arkasında açın — düz HTTP'de giriş döngüye girer)</span></label>
            </section>
            <section class="kh-card">
                <div class="sec-title">Altyapı <span style="color:#f6ad55">· yeniden başlatma gerektirir</span></div>
                <div class="kh-grid cols-2">
                    <div class="kh-field"><label class="kh-label">Tor proxy (host:port)</label><input id="tor-proxy" class="kh-input mono" required placeholder="127.0.0.1:9150"></div>
                    <div class="kh-field"><label class="kh-label">Web adresi</label><input id="web-addr" class="kh-input mono" required placeholder=":8080"></div>
                    <div class="kh-field"><label class="kh-label">Veritabanı yolu</label><input id="db-path" class="kh-input mono" required></div>
                    <div class="kh-field"><label class="kh-label">Log dizini</label><input id="log-dir" class="kh-input mono" required></div>
                </div>
            </section>
            <div class="kh-inline"><button type="submit" id="save-btn" class="kh-btn primary">Kaydet</button><button type="button" id="reload-btn" class="kh-btn subtle">Yeniden Yükle</button><span class="spacer" style="flex:1"></span><a class="kh-btn subtle" href="/healthz" target="_blank">🩺 /healthz</a></div>
        </form>
    </main>
    <script>
        const form = document.getElementById('settings-form'), saveBtn = document.getElementById('save-btn');
        function showAlert(msg, type) { const a = document.getElementById('settings-alert'); a.style.display = ''; a.className = 'kh-alert ' + type; a.textContent = msg; }
        function fill(s) {
            document.getElementById('admin-user').value = s.adminUser || ''; document.getElementById('admin-pass').value = '';
            document.getElementById('tor-proxy').value = s.torProxy || ''; document.getElementById('db-path').value = s.dbPath || ''; document.getElementById('web-addr').value = s.webAddr || ''; document.getElementById('log-dir').value = s.logDir || '';
            document.getElementById('session-ttl').value = s.sessionTtlHours || 24; document.getElementById('rate-rps').value = s.rateLimitRps || 25; document.getElementById('rate-burst').value = s.rateLimitBurst || 80;
            document.getElementById('secure-cookies').checked = !!s.secureCookies; document.getElementById('env-path').textContent = s.envFilePath || '.env';
            document.getElementById('ver').textContent = 'v' + (s.version || '');
            const ps = document.getElementById('pw-storage'); ps.textContent = s.passwordStorage === 'bcrypt' ? '🔒 parola: bcrypt' : '⚠️ parola: düz metin'; ps.className = 'kh-badge ' + (s.passwordStorage === 'bcrypt' ? 'ok' : 'warn'); ps.title = s.passwordStorage === 'bcrypt' ? 'Parola hash olarak saklanıyor' : 'Parola .env içinde düz metin; buradan yeni parola verirseniz hash\'e dönüşür';
        }
        async function load() { const d = await KH.api('/api/settings/env'); fill(d.settings); }
        document.getElementById('admin-pass').addEventListener('input', e => { const v = e.target.value; let s = 0; if (v.length >= 8) s++; if (v.length >= 12) s++; if (/[A-Z]/.test(v) && /[a-z]/.test(v)) s++; if (/\d/.test(v)) s++; if (/[^\w]/.test(v)) s++; const bar = document.getElementById('pw-bar'); bar.style.width = (v ? s * 20 : 0) + '%'; bar.style.background = s <= 2 ? '#f56565' : s <= 3 ? '#ecc94b' : '#48bb78'; });
        form.addEventListener('submit', async e => {
            e.preventDefault(); KH.busy(saveBtn, true, 'Kaydediliyor…');
            try {
                const d = await KH.api('/api/settings/env', { method: 'POST', body: { adminUser: document.getElementById('admin-user').value, adminPass: document.getElementById('admin-pass').value, torProxy: document.getElementById('tor-proxy').value, dbPath: document.getElementById('db-path').value, webAddr: document.getElementById('web-addr').value, logDir: document.getElementById('log-dir').value, sessionTtlHours: Number(document.getElementById('session-ttl').value), rateLimitRps: Number(document.getElementById('rate-rps').value), rateLimitBurst: Number(document.getElementById('rate-burst').value), secureCookies: document.getElementById('secure-cookies').checked } });
                showAlert('Kaydedildi. Anında uygulanan: ' + (d.appliedRuntime || []).join(', ') + '. Yeniden başlatma gerektiren: ' + (d.requiresRestart || []).join(', ') + '.', 'ok'); KH.toast('Ayarlar kaydedildi', 'ok'); load();
            } catch (err) { showAlert(err.message, 'err'); KH.toast(err.message, 'err'); } finally { KH.busy(saveBtn, false); }
        });
        document.getElementById('reload-btn').addEventListener('click', () => load().then(() => KH.toast('Yeniden yüklendi', 'ok')).catch(e => showAlert(e.message, 'err')));
        load().catch(e => showAlert(e.message, 'err'));
    </script>
</body>
</html>
