{{define "doc"}}<!DOCTYPE html>
<html lang="{{.Lang}}" data-theme="{{if .Theme}}{{.Theme}}{{else}}auto{{end}}"{{if .SidebarCollapsed}} class="sb-collapsed"{{end}}>
<head>
{{template "head" .}}
{{end}}

{{define "head"}}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="KeywordHunter — Dark Web Cyber Threat Intelligence Platform">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#05070c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!-- Tamamen yerel varlıklar: CDN yok (Tor/çevrimdışı ortamda çalışır), satır içi betik yok (sıkı CSP) -->
<link rel="preload" href="/static/fonts/plus-jakarta-sans-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/fonts/fonts.css?v={{version}}">
<link rel="stylesheet" href="/static/css/kh.css?v={{version}}">
<script type="application/json" id="kh-i18n">{{.I18n}}</script>
<script src="/static/js/app.js?v={{version}}" defer></script>
{{end}}

{{/* </head> kapatır ve gövdeyi açar: sayfa kimliği + rol (CSS/JS rol kancaları) */}}
{{define "body"}}
</head>
<body data-page="{{.ActivePage}}" data-role="{{.Role}}"{{if .Need2FA}} data-need2fa="1"{{end}}{{if eq .Role "viewer"}} class="role-viewer"{{end}}>
{{end}}
