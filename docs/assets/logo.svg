<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128" role="img" aria-label="KeywordHunter">
  <title>KeywordHunter — Onion Reticle</title>
  <style>
    .o,.m{stroke-dasharray:100;stroke-dashoffset:100;animation:d 1.4s cubic-bezier(.16,1,.3,1) forwards}
    .m{animation-delay:.25s}
    .r{opacity:0;transform-origin:32px 38px;animation:l .7s cubic-bezier(.34,1.56,.64,1) .9s forwards}
    .c{transform-origin:32px 38px;transform:scale(0);animation:k .5s cubic-bezier(.34,1.56,.64,1) 1.1s forwards,b 3.2s ease-in-out 1.6s infinite}
    .p{transform-origin:32px 38px;opacity:0;animation:p 3.2s cubic-bezier(.16,1,.3,1) 1.6s infinite}
    .s{transform-origin:32px 38px;opacity:0;animation:f .6s 1.2s forwards,r 3.6s linear 1.2s infinite}
    .t{transform-origin:32px 38px;animation:r 30s linear infinite reverse}
    @keyframes d{to{stroke-dashoffset:0}}
    @keyframes l{from{opacity:0;transform:scale(1.8) rotate(-45deg)}to{opacity:1;transform:none}}
    @keyframes k{to{transform:scale(1)}}
    @keyframes b{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
    @keyframes p{0%{opacity:.9;transform:scale(1)}70%,100%{opacity:0;transform:scale(4.2)}}
    @keyframes f{to{opacity:1}}
    @keyframes r{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.o,.m{stroke-dashoffset:0;animation:none}.r,.s{opacity:1;animation:none}.c{transform:none;animation:none}.p{display:none}}
  </style>
  <defs>
    <linearGradient id="g" x1="10" y1="6" x2="54" y2="60" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#6366f1"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <radialGradient id="c" cx="32" cy="38" r="5" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#67e8f9"/><stop offset="1" stop-color="#6366f1"/></radialGradient>
  </defs>
  <circle class="t" cx="32" cy="38" r="25" fill="none" stroke="url(#g)" stroke-width="1" stroke-dasharray="1.5 4.5" opacity=".35"/>
  <path class="s" d="M32 13A25 25 0 0 1 55.8 30.3" fill="none" stroke="url(#s)" stroke-width="2.2" stroke-linecap="round"/>
  <path class="o" pathLength="100" d="M32 6C36 14 52 22 52 38A20 20 0 0 1 12 38C12 22 28 14 32 6Z" fill="none" stroke="url(#g)" stroke-width="3.2" stroke-linejoin="round"/>
  <path class="m" pathLength="100" d="M32 17.4C34.6 22.6 45.2 27.6 45.2 38A13.2 13.2 0 0 1 18.8 38C18.8 27.6 29.4 22.6 32 17.4Z" fill="none" stroke="url(#g)" stroke-width="2" stroke-linejoin="round" opacity=".7"/>
  <path class="r" d="M32 27.5v4M32 44.5v4M21.5 38h4M38.5 38h4" stroke="url(#g)" stroke-width="2" stroke-linecap="round"/>
  <circle class="p" cx="32" cy="38" r="4" fill="none" stroke="#67e8f9" stroke-width="1.4"/>
  <circle class="c" cx="32" cy="38" r="3.6" fill="url(#c)"/>
</svg>
