name: Release

# İki yol:
#  - v* tag'i pushlanınca (olağan yol).
#  - Elle (Actions → Release → Run workflow): yalnız master'dan (ya da aynı
#    adlı v* tag'inden) ve o ref'in UCUNDAN; tag henüz yoksa o commit üzerinde
#    oluşturulur. İmza sertifikası ve provenance çalıştırılan ref'i/commit'i
#    adlandırır, bu yüzden başka bir dal ya da geçmiş bir commit reddedilir:
#    geçmiş bir commit için tag'i o commit'e push edin (tag push yolu).
#    Tag ruleset'i v* oluşturmayı kısıtlıyorsa bu yol tag'i oluşturamaz
#    (GITHUB_TOKEN bypass listesinde değil): önce tag'i push edin.
#
# Tedarik zinciri (doğrulama komutları README → "Sürümleri doğrulama"):
#  - İkililer: SPDX SBOM (keywordhunter-<sürüm>.spdx.json), SHA256SUMS.txt,
#    SHA256SUMS.txt'nin anahtarsız cosign imzası (SHA256SUMS.txt.sigstore.json)
#    ve dist/* için GitHub build provenance attestation'ı.
#  - İmaj: ghcr.io/<repo>@sha256:… özeti cosign ile anahtarsız imzalanır,
#    provenance attestation'ı registry'ye itilir, imajın SPDX SBOM'u
#    (keywordhunter-<sürüm>-image.spdx.json) imaj özetine SBOM attestation'ı
#    olarak bağlanır ve release'e de eklenir.
# Tüm action'lar commit SHA'sına sabitlenir (etiket taşınabilir; id-token
# yetkili işlerde her adım imza kimliğini kullanabilir). Dependabot günceller.
# İmzalama kimliği bu workflow'dur (OIDC, Fulcio sertifikası); depoda saklanan
# bir imza anahtarı yoktur.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Sürüm tag''i (ör. v0.16.0)'
        required: true
      ref:
        description: 'Beklenen tam (40 hane) commit SHA''sı; boşsa çalıştırılan ref''in ucu. Ucundan farklıysa iş durur (imza/provenance çalıştırılan commit''i adlandırır)'
        required: false
        default: ''
      latest:
        description: 'En güncel sürüm olarak işaretle (GitHub Release + :latest imajı)'
        type: choice
        options: ['true', 'false']
        default: 'true'

# Varsayılan en az yetki; her iş yalnız gerektiğini ister.
permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  REF: ${{ inputs.ref || github.sha }}
  LATEST: ${{ inputs.latest || 'true' }}
  # README'deki doğrulama komutlarının kabul ettiği imza kimliği (yalnız v*
  # tag'i ya da master); imzalar yayından önce bununla doğrulanır.
  IDENTITY_REF_RE: '@refs/(tags/v[0-9]+\.[0-9]+\.[0-9]+|heads/master)$'

jobs:
  binaries:
    name: Build release binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write     # release oluşturma + dosya yükleme
      id-token: write     # cosign anahtarsız imza + attestation (OIDC)
      attestations: write # build provenance kaydı
    steps:
      - name: Validate tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "geçersiz tag: $TAG"; exit 1; fi
          # actions/checkout kısa SHA'yı getiremez: tam SHA iste.
          if ! [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then echo "ref tam 40 haneli bir commit SHA'sı olmalı: $REF"; exit 1; fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # İmza kimliği çalıştırılan ref'tir: yalnız korumalı master ya da
            # aynı adlı tag (başka dal = incelenmemiş kod, README doğrulaması da reddeder).
            case "$GITHUB_REF" in
              refs/heads/master|"refs/tags/$TAG") ;;
              *) echo "elle sürüm yalnız master'dan ya da refs/tags/$TAG'den çalıştırılabilir (şu an: $GITHUB_REF)"; exit 1 ;;
            esac
            # Provenance ve Fulcio sertifikası GITHUB_SHA'yı kaynak commit diye
            # yazar: derlenen commit ondan farklı olamaz.
            if [ "$REF" != "$GITHUB_SHA" ]; then
              echo "ref ($REF) çalıştırılan commit ($GITHUB_SHA) değil; geçmiş bir commit için tag'i o commit'e push edin"
              exit 1
            fi
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - name: Resolve commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # Derleme ve imzadan önce: CHANGELOG bölümü yoksa erken düş.
      - name: Release notes from CHANGELOG
        id: notes
        run: |
          # "## vX.Y.Z — tarih · ad" başlığından bir sonraki "## v" başlığına kadar.
          awk -v tag="$TAG" '
            index($0, "## " tag " ") == 1 { on = 1; sub(/^## /, ""); print "# KeywordHunter " $0; next }
            on && /^## v/ { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then echo "CHANGELOG'da $TAG bölümü yok"; exit 1; fi
          # Göreli Markdown bağlantıları release sayfasında kırılır: tag'e sabit
          # mutlak adrese çevir (görseller raw/, diğerleri blob/; "başlık" korunur).
          # Şemalı (https:, mailto:), protokol-göreli (//), sayfa içi (#) ve depo
          # dışına çıkan (../) bağlantılara, kod bloklarına ve `kod` aralıklarına dokunulmaz.
          BASE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" perl -pi -e '
            if (/^\s*(?:```|~~~)/) { $fence = !$fence; next }
            next if $fence;
            s{(`+).*?\1|(!?)\[((?:[^\[\]]|\[[^\[\]]*\])*)\]\((?![A-Za-z][A-Za-z0-9+.-]*:|#|//|\.\./)(?:\./|/)?([^)\s]+)((?:\s+"[^"]*")?)\)}{
              defined $1 ? $& : $2 . "[" . $3 . "](" . $ENV{BASE} . ($2 ? "/raw/" : "/blob/") . $ENV{TAG} . "/" . $4 . $5 . ")"
            }ge
          ' "$RUNNER_TEMP/notes.md"
          title="$(head -n1 "$RUNNER_TEMP/notes.md" | sed 's/^# KeywordHunter //')"
          echo "title=$title" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Sürüm ikilileri önbelleksiz, temiz modül indirmesiyle derlenir
          # (önbellek zehirlenmesine karşı; go.sum yine doğrular).
          cache: false
      - name: Cross-compile all targets
        run: |
          VERSION="${TAG#v}"
          mkdir -p dist
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${pair%/*}"; arch="${pair#*/}"; ext=""; [ "$os" = windows ] && ext=".exe"
            out="dist/keywordhunter-${VERSION}-${os}-${arch}${ext}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X keywordhunter-mvp/pkg/web.Version=${VERSION}" -o "$out" ./cmd/main.go
            echo "built $out"
          done
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      # İkililerin içindeki Go derleme bilgisinden (modül + sürüm + Go
      # araç zinciri) SPDX SBOM. Dosya dist/ dışına yazılır ki taramaya girmesin.
      - name: SBOM (release binaries, SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist
          format: spdx-json
          output-file: ${{ runner.temp }}/keywordhunter-${{ env.VERSION }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksums
        run: |
          mv "$RUNNER_TEMP/keywordhunter-${VERSION}.spdx.json" dist/
          # SBOM de özet listesine girer: imza onu da kapsar.
          ( cd dist && sha256sum -- * > SHA256SUMS.txt )
          cat dist/SHA256SUMS.txt
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign SHA256SUMS.txt (cosign keyless)
        run: |
          cosign sign-blob --yes \
            --bundle dist/SHA256SUMS.txt.sigstore.json \
            dist/SHA256SUMS.txt
          # Yayından önce kendi imzamızı README'deki kimlik kuralıyla doğrula:
          # kullanıcının komutunun reddedeceği bir imza yayılmasın.
          repo_re="$(printf '%s' "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" | sed 's/[.]/\\./g')"
          cosign verify-blob \
            --bundle dist/SHA256SUMS.txt.sigstore.json \
            --certificate-identity-regexp "^${repo_re}/\.github/workflows/release\.yml${IDENTITY_REF_RE}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/SHA256SUMS.txt
      - name: Build provenance (dist/*)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'
      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          name: ${{ steps.notes.outputs.title }}
          body_path: ${{ runner.temp }}/notes.md
          make_latest: ${{ env.LATEST }}
          files: dist/*

  # İkililerden sonra koşar: tag/ref doğrulanmış olur ve imaj SBOM'u var olan
  # release'e eklenebilir.
  docker:
    name: Build & push Docker image
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write          # imaj SBOM'unu release'e yükleme
      packages: write          # GHCR push + imza/attestation itme
      id-token: write          # cosign anahtarsız imza + attestation (OIDC)
      attestations: write      # build provenance kaydı
      artifact-metadata: write # attestation'ın depolama kaydı (push-to-registry)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "version=${TAG#v}"
            echo "image=${image}"
            echo "tags<<EOF"
            echo "${image}:${TAG#v}"
            if [ "$LATEST" = true ]; then echo "${image}:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build & push (amd64+arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
      - name: Check digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then echo "build-push-action geçerli bir özet vermedi: '$DIGEST'"; exit 1; fi
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Etiket değil özet imzalanır: etiket sonradan başka imaja taşınabilir.
      - name: Sign image (cosign keyless, by digest)
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          repo_re="$(printf '%s' "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" | sed 's/[.]/\\./g')"
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "^${repo_re}/\.github/workflows/release\.yml${IDENTITY_REF_RE}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
      - name: Build provenance (image)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      # Çok mimarili dizinden runner platformunun (linux/amd64) imajı taranır;
      # arm64 imajı aynı Dockerfile ve aynı paketlerle derlenir.
      - name: SBOM (container image, SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: ${{ runner.temp }}/keywordhunter-${{ steps.meta.outputs.version }}-image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      # Release'teki SBOM dosyası sonradan değiştirilebilir (SHA256SUMS.txt'ye
      # girmez); imzalı kopyası imaj özetine bağlı SBOM attestation'ıdır.
      - name: SBOM attestation (image)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ runner.temp }}/keywordhunter-${{ steps.meta.outputs.version }}-image.spdx.json
          push-to-registry: true
      - name: Attach image SBOM to release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          gh release upload "$TAG" "$RUNNER_TEMP/keywordhunter-${VERSION}-image.spdx.json" \
            --repo "$GITHUB_REPOSITORY" --clobber
