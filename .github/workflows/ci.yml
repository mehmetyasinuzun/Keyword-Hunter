name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    name: Test & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          fmtout="$(gofmt -l cmd pkg)"
          if [ -n "$fmtout" ]; then echo "gofmt gerekli:"; echo "$fmtout"; exit 1; fi
      - name: go mod tidy (no drift)
        run: |
          if ! go mod tidy -diff; then echo "go.mod/go.sum düzenli değil: 'go mod tidy' çalıştırın"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: Frontend JS syntax (node --check)
        run: |
          set -e
          for f in $(find pkg/web/static/js -name '*.js' -not -path '*/vendor/*'); do node --check "$f"; done
      - name: Test (race)
        run: go test -race -count=1 ./...
      # pkg/capture'ın gerçek tarayıcı testleri (sahte SOCKS5 + sahte .onion) yalnız
      # CHROME_BIN verildiğinde koşar; runner'daki Chrome ile chromedp entegrasyonu
      # her PR'da uçtan uca doğrulanır.
      - name: Real-browser capture tests (Chrome)
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then echo "Chrome bulunamadı — atlandı"; exit 0; fi
          "$CHROME_BIN" --version
          CHROME_BIN="$CHROME_BIN" go test -race -count=1 -run '^TestBrowser_' -v ./pkg/capture
      - name: Build (all packages)
        run: go build ./...

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  crosscompile:
    name: Cross-compile matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o /tmp/kh ./cmd/main.go
