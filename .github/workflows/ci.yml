name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    name: Test & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          fmtout="$(gofmt -l cmd pkg)"
          if [ -n "$fmtout" ]; then echo "gofmt gerekli:"; echo "$fmtout"; exit 1; fi
      - name: go mod tidy (no drift)
        run: |
          if ! go mod tidy -diff; then echo "go.mod/go.sum düzenli değil: 'go mod tidy' çalıştırın"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: Frontend JS syntax (node --check)
        run: find pkg/web/static/js -name '*.js' -not -path '*/vendor/*' -print0 | xargs -0 -n1 node --check
      - name: Test (race)
        run: go test -race -count=1 ./...
      # Düşmanca dark web girdisini işleyen ayrıştırıcıların yerel fuzz hedefleri
      # (IOC çıkarımı, bağlantı/metin ayrıştırma, URL normalizasyonu) her biri kısa
      # süre koşar; yeni `func FuzzXxx` hedefleri otomatik bulunur. Tohum korpusu
      # (f.Add + testdata/fuzz) zaten `go test` ile her PR'da koşar.
      - name: Fuzz (10 s per target)
        run: |
          set -euo pipefail
          n=0
          while IFS= read -r f; do
            dir="./$(dirname "$f")"
            while IFS= read -r name; do
              echo "::group::${name} (${dir})"
              go test -run='^$' -fuzz="^${name}\$" -fuzztime=10s "$dir" < /dev/null
              echo "::endgroup::"
              n=$((n + 1))
            done < <(grep -oE '^func Fuzz[A-Za-z0-9_]*' "$f" | sed 's/^func //')
          done < <(grep -rlE --include='*_test.go' '^func Fuzz[A-Za-z0-9_]*\(' pkg cmd | sort)
          echo "${n} fuzz hedefi koştu"
          if [ "$n" -eq 0 ]; then echo "fuzz hedefi bulunamadı"; exit 1; fi
      - name: Upload fuzz crashers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore
          retention-days: 14
      # pkg/capture'ın gerçek tarayıcı testleri (sahte SOCKS5 + sahte .onion) yalnız
      # CHROME_BIN verildiğinde koşar; runner'daki Chrome ile chromedp entegrasyonu
      # her PR'da uçtan uca doğrulanır.
      - name: Real-browser capture tests (Chrome)
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then echo "Chrome bulunamadı — atlandı"; exit 0; fi
          "$CHROME_BIN" --version
          CHROME_BIN="$CHROME_BIN" go test -race -count=1 -run '^TestBrowser_' -v ./pkg/capture
      - name: Build (all packages)
        run: go build ./...

  # Yapılandırma: .golangci.yml. Linter, setup-go'nun araç zinciriyle derlenir
  # (install-mode: goinstall): hazır ikilinin Go sürümü go.mod'dan geride
  # kalırsa analiz edemez. Yerelde aynısı:
  #   go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  crosscompile:
    name: Cross-compile matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o /tmp/kh ./cmd/main.go

  # Uçtan uca: tohumlanmış demo veritabanıyla gerçek sunucu + gerçek Chromium.
  # Tor yoktur (TOR_PROXY kapalı bir porta işaret eder): uygulama Tor olmadan
  # açılmalı, Tor'a bağlı özellikler zarifçe hata vermelidir.
  e2e:
    name: E2E (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KH_BASE_URL: http://127.0.0.1:8080
      KH_ADMIN_USER: admin
      # Yalnız bu geçici CI veritabanı için; gerçek bir sır değildir.
      KH_ADMIN_PASS: E2e-Admin-Pass-CI-2026!
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build -trimpath -o "$RUNNER_TEMP/keywordhunter" ./cmd
      - name: Seed demo database (cmd/khseed)
        run: go run ./cmd/khseed -db "$RUNNER_TEMP/kh-e2e.db" -reset -admin-user "$KH_ADMIN_USER" -admin-pass "$KH_ADMIN_PASS"
      - name: Start server
        run: |
          cat > "$RUNNER_TEMP/e2e.env" <<ENV
          ADMIN_USER=${KH_ADMIN_USER}
          ADMIN_PASS=${KH_ADMIN_PASS}
          WEB_ADDR=127.0.0.1:8080
          WEB_SECURE_COOKIES=false
          TOR_PROXY=127.0.0.1:9
          DB_PATH=${RUNNER_TEMP}/kh-e2e.db
          LOG_DIR=${RUNNER_TEMP}/kh-logs
          LOG_LEVEL=info
          RATE_LIMIT_RPS=200
          RATE_LIMIT_BURST=500
          WATCHLIST_SEED=none
          METRICS_ENABLED=true
          ENV
          ENV_FILE="$RUNNER_TEMP/e2e.env" nohup "$RUNNER_TEMP/keywordhunter" > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"
      - name: Wait for /healthz
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/healthz; then echo "sunucu hazır (${i}s)"; exit 0; fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/server.pid")" 2>/dev/null; then echo "sunucu kapandı"; cat "$RUNNER_TEMP/server.log"; exit 1; fi
            sleep 1
          done
          echo "sunucu 60 sn içinde hazır olmadı"; cat "$RUNNER_TEMP/server.log"; exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: npm ci
        working-directory: e2e
        run: npm ci
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: e2e
        run: npx playwright test
      - name: Stop server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/server.pid" ]; then kill "$(cat "$RUNNER_TEMP/server.pid")" 2>/dev/null || true; fi
          cp "$RUNNER_TEMP/server.log" e2e/server.log 2>/dev/null || true
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/server.log
          retention-days: 14
