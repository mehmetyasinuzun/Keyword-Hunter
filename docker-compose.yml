services:
  tor:
    image: osminogin/tor-simple
    container_name: keywordhunter-tor
    # Tor SOCKS portu yalnızca compose ağındaki uygulamaya açıktır; host'a
    # yayınlanmaz (aksi halde LAN'daki herkes Tor'unuzu proxy olarak kullanabilirdi).
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9050 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 40s

  app:
    build: .
    container_name: keywordhunter-app
    # Varsayılan olarak yalnızca bu makineden erişilir. LAN/sunucu erişimi için:
    #   KH_BIND=0.0.0.0 docker compose up -d   (ve mutlaka güçlü bir parola + HTTPS ters vekil)
    ports:
      - "${KH_BIND:-127.0.0.1}:${KH_PORT:-8080}:8080"
    init: true
    environment:
      - ENV_FILE=/data/.env
      - TZ=${TZ:-Europe/Istanbul}
    volumes:
      - ./data:/data
    depends_on:
      tor:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 25s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    # Chromium tabanlı ekran görüntüsü için makul kaynak sınırları
    shm_size: "512m"
    mem_limit: "1500m"
    security_opt:
      - no-new-privileges:true
